<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Freshers Invitation</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    font-family:Georgia,serif;
    background:#170604;
    color:#f6d98b;
}

body{
    overflow-x:hidden;
}

/* ================= OPENING ================= */

.opening{
    width:100%;
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    position:relative;
    overflow:hidden;

    text-align:center;

    background:
    radial-gradient(
        circle at center,
        #7d3718 0%,
        #4b180d 35%,
        #260a05 65%,
        #120302 100%
    );
}

/* GOLD PARTICLES */

.opening::before{
    content:"";
    position:absolute;
    inset:0;

    background-image:
    radial-gradient(circle,#edc66d 1px,transparent 1px),
    radial-gradient(circle,#bd812c 1px,transparent 1px);

    background-size:75px 75px,120px 120px;

    opacity:.35;
}

/* GLOW */

.opening::after{
    content:"";
    position:absolute;

    width:500px;
    height:500px;

    border-radius:50%;

    background:rgba(225,157,55,.14);

    filter:blur(80px);
}

/* ARCH */

.arch{
    position:relative;
    z-index:2;

    width:min(650px,90vw);
    min-height:520px;

    padding:45px 25px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:1px solid #d9a441;

    border-radius:330px 330px 40px 40px;

    background:
    radial-gradient(
        circle,
        rgba(110,38,15,.75),
        rgba(30,7,4,.92)
    );

    box-shadow:
    0 0 35px rgba(224,170,70,.25),
    0 0 100px rgba(224,150,50,.18),
    inset 0 0 40px rgba(225,170,70,.1);
}

.arch::before{
    content:"";

    position:absolute;
    inset:14px;

    border:1px solid rgba(225,180,85,.3);

    border-radius:315px 315px 30px 30px;
}

.content{
    position:relative;
    z-index:3;

    width:100%;
}

/* OM */

.om{
    font-size:72px;

    margin-bottom:20px;

    color:#ffe5a5;

    text-shadow:
    0 0 10px #dca947,
    0 0 30px rgba(238,188,90,.7);
}

/* TITLE */

h1{
    margin:0 0 20px;

    font-size:48px;

    color:#ffe0a0;

    letter-spacing:2px;
}

/* SUBTITLE */

.subtitle{
    margin:18px 0 35px;

    font-size:21px;

    letter-spacing:4px;

    color:#e9c77d;
}

.subtitle::before,
.subtitle::after{
    content:"✦";

    margin:0 14px;

    color:#d6a542;
}

/* OPEN BUTTON */

.openBtn{
    padding:17px 44px;

    border-radius:50px;

    border:1px solid #e6b74c;

    background:
    linear-gradient(
        135deg,
        #a94b16,
        #71300f
    );

    color:#ffe8b0;

    font-size:17px;

    letter-spacing:2px;

    cursor:pointer;

    box-shadow:
    0 0 25px rgba(225,170,65,.3);

    transition:.3s;
}

.openBtn:hover{
    transform:scale(1.06);

    box-shadow:
    0 0 40px rgba(225,170,65,.55);
}

/* ================= INVITATION ================= */

.invitation{
    display:none;

    width:100%;
    min-height:100vh;

    padding:30px 12px 80px;

    text-align:center;

    background:
    radial-gradient(
        circle at top,
        #65240f,
        #2b0b06 40%,
        #120302 100%
    );
}

.invitation.show{
    display:block;

    animation:fadeIn 1s ease;
}

/* INVITATION IMAGE */

.invitation img{
    display:block;

    width:min(100%,820px);

    height:auto;

    margin:0 auto;

    border-radius:8px;

    box-shadow:
    0 20px 60px rgba(0,0,0,.75);
}

/* ================= SCRATCH AREA ================= */

.scratchWrap{
    width:min(700px,94vw);

    margin:50px auto 0;

    padding:30px 18px 38px;

    border:1px solid #c99835;

    border-radius:20px;

    background:
    linear-gradient(
        145deg,
        #511a0c,
        #260a05
    );

    box-shadow:
    0 0 35px rgba(201,152,53,.2);
}

.scratchTitle{
    margin:0 0 10px;

    font-size:28px;

    color:#ffe1a0;
}

.hint{
    margin:0 0 22px;

    font-size:14px;

    line-height:1.6;

    color:#e7c77f;
}

/* CARD */

.scratchBox{
    position:relative;

    width:min(580px,90vw);

    height:165px;

    margin:auto;

    overflow:hidden;

    border-radius:16px;

    background:
    linear-gradient(
        135deg,
        #fff0bd,
        #f2d98d
    );

    box-shadow:
    inset 0 0 20px rgba(90,40,10,.2);
}

/* DATE UNDER GOLD */

.date{
    position:absolute;

    inset:0;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:15px;

    color:#5a190c;

    font-size:30px;

    font-weight:bold;

    letter-spacing:2px;

    text-align:center;

    user-select:none;
}

/* SCRATCH CANVAS */

#scratch{
    position:absolute;

    left:0;
    top:0;

    width:100%;
    height:100%;

    z-index:10;

    display:block;

    touch-action:none;

    cursor:crosshair;
}

/* ================= MUSIC ================= */

.musicBtn{
    position:fixed;

    right:20px;
    bottom:20px;

    z-index:100;

    width:58px;
    height:58px;

    border-radius:50%;

    border:1px solid #d9a441;

    background:#42150b;

    color:#ffe4a0;

    font-size:24px;

    cursor:pointer;

    display:none;

    box-shadow:
    0 0 20px rgba(217,164,65,.4);
}

.musicBtn.show{
    display:block;
}

/* ================= ANIMATION ================= */

@keyframes fadeIn{

    from{
        opacity:0;
        transform:translateY(25px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

/* ================= MOBILE ================= */

@media(max-width:600px){

    .arch{
        min-height:450px;
    }

    .om{
        font-size:55px;
    }

    h1{
        font-size:35px;
    }

    .subtitle{
        font-size:16px;
        letter-spacing:3px;
    }

    .subtitle::before,
    .subtitle::after{
        margin:0 5px;
    }

    .openBtn{
        padding:15px 28px;
        font-size:14px;
    }

    .date{
        font-size:22px;
    }

    .scratchTitle{
        font-size:23px;
    }

}
</style>
</head>


<body>


<!-- ================= OPENING ================= -->

<section class="opening" id="opening">

    <div class="arch">

        <div class="content">

            <div class="om">ॐ</div>

            <h1>शुभ आरम्भ</h1>

            <div class="subtitle">
                A NEW BEGINNING AWAITS
            </div>

            <button
                class="openBtn"
                id="openBtn">

                OPEN THE INVITATION

            </button>

        </div>

    </div>

</section>


<!-- ================= INVITATION ================= -->

<section
    class="invitation"
    id="invitation">

    <img
        src="invitation.png"
        alt="Freshers Party Invitation"
    >


    <!-- SCRATCH CARD -->

    <div class="scratchWrap">

        <h2 class="scratchTitle">
            ✨ A Little Surprise ✨
        </h2>

        <p class="hint">
            Touch and scratch the golden card to reveal the date
        </p>


        <div class="scratchBox">

            <div class="date">
                12th SEPTEMBER 2026
            </div>

            <canvas id="scratch"></canvas>

        </div>

    </div>

</section>


<!-- ================= MUSIC ================= -->

<button
    class="musicBtn"
    id="musicBtn">

    ♫

</button>


<audio
    id="music"
    src="krishna_krish_flute.mp3"
    preload="auto"
    loop>
</audio>


<script>

/* ================= OPENING ================= */

const openBtn =
document.getElementById("openBtn");

const opening =
document.getElementById("opening");

const invitation =
document.getElementById("invitation");

const music =
document.getElementById("music");

const musicBtn =
document.getElementById("musicBtn");


openBtn.addEventListener(
    "click",
    function(){

        opening.style.display="none";

        invitation.classList.add("show");

        musicBtn.classList.add("show");

        /*
        The click is a user interaction,
        so the browser allows the music
        to start here.
        */

        music.play()
        .then(function(){

            musicBtn.textContent="♫";

        })
        .catch(function(){

            musicBtn.textContent="🔇";

        });

        window.scrollTo(0,0);

    }
);


/* ================= MUSIC BUTTON ================= */

musicBtn.addEventListener(
    "click",
    function(){

        if(music.paused){

            music.play()
            .then(function(){

                musicBtn.textContent="♫";

            });

        }else{

            music.pause();

            musicBtn.textContent="🔇";

        }

    }
);


/* ================= SCRATCH CARD ================= */

const canvas =
document.getElementById("scratch");

const box =
document.querySelector(".scratchBox");

const ctx =
canvas.getContext("2d");


let scratching=false;


/* CREATE GOLD COVER */

function createScratchCard(){

    const rect =
    box.getBoundingClientRect();

    const dpr =
    window.devicePixelRatio || 1;


    canvas.width =
    rect.width * dpr;

    canvas.height =
    rect.height * dpr;


    canvas.style.width =
    rect.width+"px";

    canvas.style.height =
    rect.height+"px";


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );


    /* GOLD COVER */

    ctx.globalCompositeOperation =
    "source-over";


    const gradient =
    ctx.createLinearGradient(
        0,
        0,
        rect.width,
        rect.height
    );


    gradient.addColorStop(
        0,
        "#8d641a"
    );

    gradient.addColorStop(
        .25,
        "#d6aa43"
    );

    gradient.addColorStop(
        .5,
        "#b98220"
    );

    gradient.addColorStop(
        .75,
        "#dfb650"
    );

    gradient.addColorStop(
        1,
        "#946918"
    );


    ctx.fillStyle =
    gradient;


    ctx.fillRect(
        0,
        0,
        rect.width,
        rect.height
    );


    /* CARD TEXT */

    ctx.fillStyle =
    "rgba(255,240,190,.95)";


    ctx.font =
    "bold 21px Georgia";


    ctx.textAlign =
    "center";


    ctx.textBaseline =
    "middle";


    ctx.fillText(
        "✨  SCRATCH TO REVEAL  ✨",
        rect.width/2,
        rect.height/2
    );


    /* RESET */

    ctx.globalCompositeOperation =
    "destination-out";

}


/* SCRATCH POSITION */

function getPosition(e){

    const rect =
    canvas.getBoundingClientRect();

    return{

        x:e.clientX-rect.left,

        y:e.clientY-rect.top

    };

}


/* SCRATCH */

function scratchAt(x,y){

    ctx.globalCompositeOperation =
    "destination-out";


    ctx.beginPath();


    ctx.arc(
        x,
        y,
        30,
        0,
        Math.PI*2
    );


    ctx.fill();

}


/* START SCRATCH */

canvas.addEventListener(
    "pointerdown",
    function(e){

        scratching=true;

        canvas.setPointerCapture(
            e.pointerId
        );

        const p =
        getPosition(e);

        scratchAt(
            p.x,
            p.y
        );

        e.preventDefault();

    }
);


/* CONTINUE SCRATCH */

canvas.addEventListener(
    "pointermove",
    function(e){

        if(!scratching)return;

        const p =
        getPosition(e);

        scratchAt(
            p.x,
            p.y
        );

        e.preventDefault();

    }
);


/* STOP */

canvas.addEventListener(
    "pointerup",
    function(e){

        scratching=false;

        try{

            canvas.releasePointerCapture(
                e.pointerId
            );

        }catch(error){}

    }
);


canvas.addEventListener(
    "pointercancel",
    function(){

        scratching=false;

    }
);


/* INITIALIZE AFTER PAGE LOAD */

window.addEventListener(
    "load",
    function(){

        createScratchCard();

    }
);


/* RESIZE */

window.addEventListener(
    "resize",
    function(){

        createScratchCard();

    }
);

</script>

</body>
</html>

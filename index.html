<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Freshers Invitation</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  background:#170604;
  color:#f8d98a;
  font-family:Georgia,serif;
}

body{
  min-height:100vh;
  overflow-x:hidden;
}

/* ================= OPENING ================= */

.opening{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
  text-align:center;

  background:
    radial-gradient(circle at 50% 45%,
    #7b3517 0%,
    #4a170d 30%,
    #260a05 60%,
    #120302 100%);
}

/* stars / particles */

.opening:before{
  content:"";
  position:absolute;
  inset:0;

  background-image:
    radial-gradient(circle,#e8bd63 1px,transparent 1px),
    radial-gradient(circle,#c68b35 1px,transparent 1px);

  background-size:80px 80px,125px 125px;
  background-position:0 0,40px 30px;

  opacity:.3;
}

/* central glow */

.opening:after{
  content:"";
  position:absolute;

  width:600px;
  height:600px;

  border-radius:50%;

  background:rgba(220,150,55,.13);

  filter:blur(90px);

  animation:glowPulse 4s infinite alternate;
}

/* ================= ARCH ================= */

.arch{
  position:relative;
  z-index:2;

  width:min(650px,90vw);
  min-height:540px;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:50px 30px;

  border:1px solid #dcae4d;

  border-radius:330px 330px 40px 40px;

  background:
    radial-gradient(circle at center,
    rgba(103,35,15,.75),
    rgba(30,7,4,.88));

  box-shadow:
    0 0 35px rgba(225,170,70,.2),
    0 0 100px rgba(225,150,40,.18),
    inset 0 0 45px rgba(220,160,65,.1);

  animation:appear 1.5s ease;
}

/* inner arch */

.arch:before{
  content:"";

  position:absolute;
  inset:14px;

  border:1px solid rgba(222,175,78,.28);

  border-radius:315px 315px 30px 30px;

  pointer-events:none;
}

.content{
  position:relative;
  z-index:2;

  max-width:550px;
}

/* OM */

.om{
  font-size:72px;
  margin-bottom:20px;

  color:#ffe29a;

  text-shadow:
    0 0 10px #d9a441,
    0 0 30px rgba(240,190,90,.7);

  animation:omGlow 2.5s infinite alternate;
}

/* Hindi */

h1{
  margin:0 0 20px;

  font-size:48px;
  letter-spacing:2px;

  color:#ffe0a0;

  text-shadow:0 0 15px rgba(228,180,76,.45);
}

/* subtitle */

.subtitle{
  font-size:21px;

  letter-spacing:5px;

  margin:18px 0 34px;

  color:#e8c47b;
}

/* decorative line */

.subtitle:before,
.subtitle:after{
  content:"✦";

  margin:0 14px;

  color:#d6a542;
}

/* button */

.openBtn{
  position:relative;

  border:1px solid #e5b84f;

  background:
    linear-gradient(135deg,#a84a16,#71300f);

  color:#ffe8ad;

  padding:17px 45px;

  border-radius:50px;

  font-size:17px;

  letter-spacing:2px;

  cursor:pointer;

  box-shadow:
    0 0 20px rgba(225,170,65,.25),
    inset 0 0 12px rgba(255,220,130,.08);

  transition:.35s;
}

.openBtn:hover{
  transform:scale(1.07);

  box-shadow:
    0 0 35px rgba(225,170,65,.6),
    0 0 70px rgba(225,150,50,.2);
}

.openBtn:active{
  transform:scale(.97);
}

/* ================= INVITATION ================= */

.invitation{
  display:none;

  min-height:100vh;

  padding:35px 12px 80px;

  text-align:center;

  background:
    radial-gradient(circle at top,
    #65240f 0%,
    #2b0b06 35%,
    #120302 90%);
}

.invitation.show{
  display:block;

  animation:invitationIn 1.2s ease;
}

.invitation img{
  display:block;

  width:min(100%,820px);

  height:auto;

  margin:0 auto;

  border-radius:8px;

  box-shadow:
    0 20px 60px rgba(0,0,0,.75),
    0 0 25px rgba(214,164,70,.12);
}

/* ================= SCRATCH SECTION ================= */

.scratchWrap{
  width:min(700px,94vw);

  margin:50px auto 0;

  padding:30px 18px 38px;

  border:1px solid #c99835;

  border-radius:20px;

  background:
    linear-gradient(145deg,
    #511a0c,
    #260a05);

  box-shadow:
    0 0 35px rgba(201,152,53,.18),
    inset 0 0 25px rgba(218,165,65,.06);
}

.scratchTitle{
  margin:0 0 10px;

  font-size:28px;

  color:#ffe1a0;
}

.hint{
  margin:0 0 22px;

  font-size:14px;

  line-height:1.6;

  color:#e8c77f;
}

/* scratch card */

.scratchBox{
  position:relative;

  width:min(580px,90vw);

  height:165px;

  margin:auto;

  overflow:hidden;

  border-radius:16px;

  background:
    linear-gradient(135deg,
    #fff0bd,
    #f2d98d);

  box-shadow:
    inset 0 0 20px rgba(100,50,10,.15);
}

/* date */

.date{
  position:absolute;

  inset:0;

  display:flex;

  align-items:center;

  justify-content:center;

  padding:15px;

  color:#5a190c;

  font-size:30px;

  font-weight:bold;

  letter-spacing:2px;

  text-align:center;

  user-select:none;
}

/* scratch canvas */

#scratch{
  position:absolute;

  left:0;
  top:0;

  width:100%;
  height:100%;

  z-index:5;

  touch-action:none;

  cursor:crosshair;
}

/* music button */

.musicBtn{
  position:fixed;

  right:20px;
  bottom:20px;

  z-index:20;

  width:58px;
  height:58px;

  border-radius:50%;

  border:1px solid #d9a441;

  background:#42150b;

  color:#ffe4a0;

  font-size:24px;

  cursor:pointer;

  display:none;

  box-shadow:
    0 0 20px rgba(217,164,65,.35);

  transition:.3s;
}

.musicBtn.show{
  display:block;
}

.musicBtn:hover{
  transform:scale(1.08);
}

/* ================= ANIMATIONS ================= */

@keyframes appear{
  from{
    opacity:0;
    transform:scale(.94) translateY(20px);
  }

  to{
    opacity:1;
    transform:scale(1) translateY(0);
  }
}

@keyframes invitationIn{
  from{
    opacity:0;
    transform:translateY(25px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes omGlow{
  from{
    text-shadow:
      0 0 8px rgba(230,185,90,.3);
  }

  to{
    text-shadow:
      0 0 15px rgba(230,185,90,.9),
      0 0 35px rgba(220,150,50,.5);
  }
}

@keyframes glowPulse{
  from{
    transform:scale(.9);
    opacity:.5;
  }

  to{
    transform:scale(1.1);
    opacity:1;
  }
}

/* ================= MOBILE ================= */

@media(max-width:600px){

  .arch{
    min-height:460px;
    padding:40px 20px;
  }

  .om{
    font-size:55px;
  }

  h1{
    font-size:35px;
  }

  .subtitle{
    font-size:16px;
    letter-spacing:3px;
  }

  .subtitle:before,
  .subtitle:after{
    margin:0 5px;
  }

  .openBtn{
    padding:15px 28px;
    font-size:14px;
  }

  .scratchTitle{
    font-size:23px;
  }

  .date{
    font-size:22px;
  }

}
</style>
</head>


<body>

<!-- ================= OPENING ================= -->

<section class="opening" id="opening">

  <div class="arch">

    <div class="content">

      <div class="om">ॐ</div>

      <h1>शुभ आरम्भ</h1>

      <div class="subtitle">
        A NEW BEGINNING AWAITS
      </div>

      <button class="openBtn" id="openBtn">
        OPEN THE INVITATION
      </button>

    </div>

  </div>

</section>


<!-- ================= INVITATION ================= -->

<section class="invitation" id="invitation">

  <img
    src="invitation.png"
    alt="Freshers Party Invitation"
  >


  <!-- SCRATCH DATE -->

  <div class="scratchWrap">

    <h2 class="scratchTitle">
      ✨ A Little Surprise ✨
    </h2>

    <p class="hint">
      Touch or drag across the golden card to reveal the date
    </p>

    <div class="scratchBox">

      <div class="date">
        12th SEPTEMBER 2026
      </div>

      <canvas id="scratch"></canvas>

    </div>

  </div>

</section>


<!-- ================= MUSIC ================= -->

<button
  class="musicBtn"
  id="musicBtn"
  aria-label="Toggle music">

  ♫

</button>


<audio
  id="music"
  src="krishna_krish_flute.mp3"
  preload="auto"
  loop>
</audio>


<script>

/* ================= ELEMENTS ================= */

const openBtn =
  document.getElementById("openBtn");

const opening =
  document.getElementById("opening");

const invitation =
  document.getElementById("invitation");

const music =
  document.getElementById("music");

const musicBtn =
  document.getElementById("musicBtn");


/* ================= OPEN INVITATION ================= */

openBtn.addEventListener("click", async function(){

  /* hide opening */

  opening.style.display = "none";

  /* show invitation */

  invitation.classList.add("show");

  /* show music button */

  musicBtn.classList.add("show");

  /* play music */

  try{

    music.currentTime = 0;

    await music.play();

    musicBtn.textContent = "♫";

  }catch(error){

    musicBtn.textContent = "🔇";

  }

  /* go to top */

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

});


/* ================= MUSIC CONTROL ================= */

musicBtn.addEventListener("click", async function(){

  if(music.paused){

    try{

      await music.play();

      musicBtn.textContent = "♫";

    }catch(error){

      musicBtn.textContent = "🔇";

    }

  }else{

    music.pause();

    musicBtn.textContent = "🔇";

  }

});


/* ================= SCRATCH CARD ================= */

const canvas =
  document.getElementById("scratch");

const box =
  document.querySelector(".scratchBox");

const ctx =
  canvas.getContext("2d");

let drawing = false;


/* resize */

function resizeCanvas(){

  const rect =
    box.getBoundingClientRect();

  const dpr =
    window.devicePixelRatio || 1;

  canvas.width =
    rect.width * dpr;

  canvas.height =
    rect.height * dpr;

  canvas.style.width =
    rect.width + "px";

  canvas.style.height =
    rect.height + "px";

  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );

  /* gold scratch layer */

  ctx.globalCompositeOperation =
    "source-over";

  const gradient =
    ctx.createLinearGradient(
      0,
      0,
      rect.width,
      rect.height
    );

  gradient.addColorStop(
    0,
    "#d5a638"
  );

  gradient.addColorStop(
    .5,
    "#b77b1e"
  );

  gradient.addColorStop(
    1,
    "#d6a943"
  );

  ctx.fillStyle =
    gradient;

  ctx.fillRect(
    0,
    0,
    rect.width,
    rect.height
  );

  /* texture */

  ctx.fillStyle =
    "rgba(255,235,170,.35)";

  for(
    let x=0;
    x<rect.width;
    x+=18
  ){

    for(
      let y=0;
      y<rect.height;
      y+=18
    ){

      ctx.beginPath();

      ctx.arc(
        x,
        y,
        1.2,
        0,
        Math.PI*2
      );

      ctx.fill();

    }

  }

}


/* scratch */

function scratch(x,y){

  ctx.globalCompositeOperation =
    "destination-out";

  ctx.beginPath();

  ctx.arc(
    x,
    y,
    28,
    0,
    Math.PI*2
  );

  ctx.fill();

}


/* position */

function getPosition(e){

  const rect =
    canvas.getBoundingClientRect();

  let clientX;
  let clientY;

  if(e.touches){

    clientX =
      e.touches[0].clientX;

    clientY =
      e.touches[0].clientY;

  }else{

    clientX =
      e.clientX;

    clientY =
      e.clientY;

  }

  return{

    x:clientX - rect.left,

    y:clientY - rect.top

  };

}


/* start */

function startScratch(e){

  drawing = true;

  const p =
    getPosition(e);

  scratch(
    p.x,
    p.y
  );

  e.preventDefault();

}


/* move */

function moveScratch(e){

  if(!drawing)return;

  const p =
    getPosition(e);

  scratch(
    p.x,
    p.y
  );

  e.preventDefault();

}


/* stop */

function endScratch(){

  drawing = false;

}


/* mouse */

canvas.addEventListener(
  "mousedown",
  startScratch
);

canvas.addEventListener(
  "mousemove",
  moveScratch
);

window.addEventListener(
  "mouseup",
  endScratch
);


/* touch */

canvas.addEventListener(
  "touchstart",
  startScratch,
  {passive:false}
);

canvas.addEventListener(
  "touchmove",
  moveScratch,
  {passive:false}
);

window.addEventListener(
  "touchend",
  endScratch
);


/* resize */

window.addEventListener(
  "resize",
  resizeCanvas
);


/* initial */

resizeCanvas();

</script>

</body>
</html>
